XZ.crGo=n=>{const id=V('zc1'),p=PJ(id);if(!p)return;const t=today(),a=add(t,-(n-1)),f=d=>d.split('-').reverse().join('.');let m=0;const dn=[],op=[];for(let d=a;d<=t;d=add(d,1))S.ev.forEach(e=>{if(e.proj!=id)return;const o=occ(e,d);if(!o)return;if(e.kind=='task'){if(e.done&&e.done[d])dn.push(e.title)}else if(e.kind!='habit'&&!e.ad)m+=dur(o[0],o[1])});S.ev.forEach(e=>{if(e.proj==id&&e.kind=='task'&&nr(e)&&!(e.done&&e.done[e.date])&&e.date>=t)op.push(e.title+' (до '+f(e.date).slice(0,5)+')')});$('zc2').value='Отчёт по проекту «'+p.t+'»\nПериод: '+f(a)+' — '+f(t)+'\n\nОтработано: '+hrs(m)+'\n\nСделано:\n'+(dn.map(x=>'• '+x).join('\n')||'—')+'\n\nВ планах:\n'+(op.slice(0,10).map(x=>'• '+x).join('\n')||'—')};

function cand(){const t=today(),L=[],top=(S.top&&S.top[t])||[];S.ev.forEach(e=>{if(e.kind!='task')return;const d=nr(e)?e.date:t;if(!occ(e,d)||(e.done&&e.done[d])||d>add(t,3))return;let s=(e.pri||0)*20;if(d<t)s+=50+Math.min(20,Math.round((P(t)-P(d))/864e5)*3);if(d==t)s+=30;if(top.includes(e.id))s+=40;if(+e.est&&+e.est<=1)s+=5;L.push({e,d,s,why:d<t?'просрочено':top.includes(e.id)?'из главных 3':d==t?'запланировано на сегодня':'скоро срок'})});return L.sort((a,b)=>b.s-a.s)}

let AC=null,SN=null,SK='';
function stopS(){if(SN){SN.n.forEach(x=>{try{x.stop()}catch(e){}});try{SN.g.disconnect()}catch(e){}SN=null}SK=''}
function snd(k){stopS();if(!k)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=AC||new C();if(AC.state=='suspended')AC.resume();const g=AC.createGain();g.gain.value=+localStorage.igsv||.25;g.connect(AC.destination);let n=[];if(k=='brown'||k=='rain'){const b=AC.createBuffer(1,AC.sampleRate*4,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;if(k=='brown'){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w*.5}const s=AC.createBufferSource();s.buffer=b;s.loop=true;if(k=='rain'){const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=900;const f2=AC.createBiquadFilter();f2.type='lowpass';f2.frequency.value=7000;s.connect(f);f.connect(f2);f2.connect(g)}else s.connect(g);s.start();n=[s]}else{[110,110.7,220.3].forEach(fr=>{const o=AC.createOscillator();o.frequency.value=fr;const gg=AC.createGain();gg.gain.value=.15;o.connect(gg);gg.connect(g);o.start();n.push(o)})}SN={n,g};SK=k}
XZ.snd=k=>{if(typeof k=='string'){snd(k=='off'?'':k);const f=$('xfs2');if(f)f.remove()}else XZ.sndPg()};

setInterval(()=>{const f=$('xf');if(f&&!f.hidden){if(!f.querySelector('#xfs2')){const d=document.createElement('div');d.id='xfs2';d.className='xfd';d.innerHTML=[['rain','🌧'],['brown','🌊'],['hum','🧠'],['','🔇']].map(a=>`<button class="${SK==a[0]?'on':''}" onclick="XZ.snd2('${a[0]}')">${a[1]}</button>`).join('');(f.querySelector('.xfm')||f).appendChild(d)}}else if(SN)stopS()},1000);
